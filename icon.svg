<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512">
  <!-- 뉴스디자인 근무표 앱 아이콘 — 날씨앱(WeatherCG)·영상플레이어 최신판과 같은 스타일: 하늘색→파랑 배지 + 밝은 테두리 + 유리 느낌 글리프(달력) -->
  <defs>
    <linearGradient id="ahBadge" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#06D4EB"/>
      <stop offset=".48" stop-color="#009EF7"/>
      <stop offset="1" stop-color="#0757F5"/>
    </linearGradient>
    <linearGradient id="ahGlyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FFFF"/>
      <stop offset=".46" stop-color="#D0F3FF"/>
      <stop offset="1" stop-color="#89C8FF"/>
    </linearGradient>
    <linearGradient id="ahEdge" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#A0FFFF"/>
      <stop offset=".42" stop-color="#27E9F6"/>
      <stop offset="1" stop-color="#00C7E9"/>
    </linearGradient>
    <filter id="ahDepth" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy=".65" stdDeviation=".65" flood-color="#0056BF" flood-opacity=".3"/>
    </filter>
    <!-- 달력 몸통: 머리 띠 아래 가는 틈 + 날짜 칸 6개를 뚫어 배지 색이 비치게 -->
    <mask id="ahCal" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <rect x="0" y="0" width="40" height="40" fill="#fff"/>
      <rect x="8" y="16.9" width="24" height="1.05" fill="#000"/>
      <g fill="#000">
        <rect x="12.55" y="20.35" width="3.5" height="3.1" rx="1.05"/>
        <rect x="18.25" y="20.35" width="3.5" height="3.1" rx="1.05"/>
        <rect x="23.95" y="20.35" width="3.5" height="3.1" rx="1.05"/>
        <rect x="12.55" y="25.05" width="3.5" height="3.1" rx="1.05"/>
        <rect x="18.25" y="25.05" width="3.5" height="3.1" rx="1.05"/>
        <rect x="23.95" y="25.05" width="3.5" height="3.1" rx="1.05"/>
      </g>
    </mask>
    <!-- 고리 둘레 틈(몸통 위로 걸린 고리가 몸통과 붙어 보이지 않게) -->
    <mask id="ahRing" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <rect x="0" y="0" width="40" height="40" fill="#fff"/>
      <rect x="13.15" y="8.15" width="3.7" height="6.7" rx="1.85" fill="#000"/>
      <rect x="23.15" y="8.15" width="3.7" height="6.7" rx="1.85" fill="#000"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#ahBadge)"/>
  <rect x="1.5" y="1.5" width="37" height="37" rx="10.5" fill="none" stroke="url(#ahEdge)" stroke-width=".5"/>
  <g filter="url(#ahDepth)">
    <g mask="url(#ahRing)">
      <rect x="9" y="11.6" width="22" height="19.4" rx="4.2" fill="url(#ahGlyph)" stroke="#E2FBFF" stroke-width=".18" mask="url(#ahCal)"/>
    </g>
    <rect x="13.6" y="8.6" width="2.8" height="5.8" rx="1.4" fill="url(#ahGlyph)" stroke="#E2FBFF" stroke-width=".18"/>
    <rect x="23.6" y="8.6" width="2.8" height="5.8" rx="1.4" fill="url(#ahGlyph)" stroke="#E2FBFF" stroke-width=".18"/>
  </g>
</svg>
